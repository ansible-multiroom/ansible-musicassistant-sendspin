---

- name: Create user for maclient
  ansible.builtin.user:
    name: maclient
    system: true
    groups: audio
    shell: /usr/sbin/nologin

- name: Create dir for maclient
  ansible.builtin.file:
    path: /opt/maclient
    state: directory
    owner: maclient
    group: maclient
    mode: '0755'
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create virtenv for maclient
  become: true
  become_user: maclient
  ansible.builtin.pip:
    name: 
      - pip
      - aiohttp
      - music-assistant-client
    state: present
    virtualenv: /opt/maclient
    virtualenv_command: /opt/python314/bin/python3.14 -m venv
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create import_m3u_playlist.py script
  ansible.builtin.template:
    src: usr/local/bin/import_m3u_playlist.py.j2
    dest: /usr/local/bin/import_m3u_playlist.py
    owner: root
    group: root
    mode: '0755'

- name: Create dummy access token file if not here yet
  ansible.builtin.copy:
    dest: /usr/local/bin/ma_access_token
    owner: root
    group: root
    mode: '0644'
    force: no
    content: |
      <put here your musicassistant access token on one single line>
