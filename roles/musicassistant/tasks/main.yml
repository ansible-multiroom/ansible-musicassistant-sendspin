---

- name: Install podman and rootless dependencies
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - fuse-overlayfs
    state: present
  notify: Restart Music Assistant

- name: Create user for musicassistant
  ansible.builtin.user:
    name: "{{ musicassistant_user }}"
    system: true
    shell: /usr/sbin/nologin
  notify: Restart Music Assistant

- name: Create musicassistant data dir
  ansible.builtin.file:
    path: "{{ musicassistant_data_dir }}"
    state: directory
    owner: "{{ musicassistant_user }}"
    group: "{{ musicassistant_user }}"
    mode: '0755'
  notify: Restart Music Assistant

- name: Configure /etc/subuid
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: '^{{ musicassistant_user }}:'
    line: "{{ musicassistant_user }}:{{ musicassistant_subuid_start }}:{{ musicassistant_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart Music Assistant

- name: Configure /etc/subgid
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: '^{{ musicassistant_user }}:'
    line: "{{ musicassistant_user }}:{{ musicassistant_subgid_start }}:{{ musicassistant_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart Music Assistant

- name: Download container if newer
  become: true
  become_user: "{{ musicassistant_user }}"
  containers.podman.podman_image:
    name: ghcr.io/music-assistant/server
    tag: latest
    pull: true
    force: true
  register: musicassistant_image_pull
  changed_when: >-
    not ansible_check_mode and musicassistant_image_pull.changed
  notify: Restart Music Assistant
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create musicassistant systemd service
  ansible.builtin.template:
    src: etc/systemd/system/musicassistant.service.j2
    dest: /etc/systemd/system/musicassistant.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Music Assistant
