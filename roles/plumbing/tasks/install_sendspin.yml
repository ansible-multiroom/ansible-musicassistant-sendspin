---

- name: Install sendspin missing dependencies
  ansible.builtin.apt:
    name:
      - libportaudio2
      - libavahi-compat-libdnssd1
      - libpipewire-0.3-0t64

- name: Install sendspin binary version {{ sendspin_version }}
  ansible.builtin.unarchive:
    remote_src: yes
    src: "https://github.com/Sendspin/sendspin-cpp-cli/releases/download/v{{ sendspin_version }}/sendspin-cli-{{ sendspin_version}}-linux-arm64.tar.gz"
    dest: /usr/local/bin
    mode: '0755'
    owner: root
    group: root
    # Install the sendspin-cli binary only
    extra_opts:
      - "--strip-components=4"
      - "sendspin-cli-{{ sendspin_version}}-linux-arm64/usr/local/bin/sendspin-cli"
  notify: Restart sendspin services

- name: Create sendspin user
  ansible.builtin.user:
    name: sendspin
    system: true
    groups: audio
    shell: /usr/sbin/nologin
  notify: Restart sendspin services

- name: Create directories for sendspin instances
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: sendspin
    group: sendspin
    mode: '0755'
  loop:
    - "{{ sendspin_config_dir }}"
    - "{{ sendspin_state_dir }}"
    - "{{ sendspin_socket_dir }}"
  notify: Restart sendspin services

- name: Create sendspin generic systemd unit
  ansible.builtin.template:
    src: "etc/systemd/system/sendspin@.service.j2"
    dest: "/etc/systemd/system/sendspin@.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart sendspin services

