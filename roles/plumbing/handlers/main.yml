---

- name: Restart sendspin services
  ansible.builtin.systemd:
    name: sendspin@{{ item.name }}.service
    daemon_reload: yes
    state: restarted
    masked: no
    enabled: yes
  when: item.s2a is defined or item.a2s is defined
  loop: "{{ plumbings }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart bluetoothd
  ansible.builtin.systemd:
    name: "bluetooth.service"
    daemon_reload: yes
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart bt-agent
  ansible.builtin.systemd:
    name: "bt-agent.service"
    daemon_reload: yes
    state: restarted
    masked: no
    enabled: yes
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart bluealsa
  ansible.builtin.systemd:
    name: "bluealsa.service"
    daemon_reload: yes
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart alsa2alsa
  ansible.builtin.systemd:
    name: "alsa2alsa@{{ item.name }}"
    daemon_reload: yes
    state: restarted
    masked: no
    enabled: yes
  when: item.a2a is defined
  loop: "{{ plumbings }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart alsa2http
  ansible.builtin.systemd:
    name: "alsa2http@{{ item.name }}"
    daemon_reload: yes
    state: restarted
    masked: no
    enabled: yes
  when: item.a2h is defined
  loop: "{{ plumbings }}"
  ignore_errors: "{{ ansible_check_mode }}"
