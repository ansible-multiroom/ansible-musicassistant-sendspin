---

- name: Skip entire role if local_captures are not defined
  when: local_captures is not defined
  block:
    - name: Tell that we skip this role
      ansible.builtin.debug:
        msg: "Skipping"
    
    - name: Skip this role
      ansible.builtin.meta: end_role

- name: Configure bluetooth and bluealsa
  when: local_captures | selectattr('a2a.source', 'defined') | selectattr('a2a.source', 'equalto', 'bluealsa') | list | length > 0
  block:
    - name: Configure bluetooth daemon
      ansible.builtin.include_tasks: bluetooth.yml
    
    - name: Configure Blue Alsa
      ansible.builtin.include_tasks: bluealsa.yml

- name: Configure local capture audio pipe
  ansible.builtin.include_tasks: audiopipe.yml
