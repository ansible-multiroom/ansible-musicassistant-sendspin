---

- name: Create capture settings files
  ansible.builtin.copy:
    dest: "/etc/default/capture_{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if item.a2a is defined and item.a2a.source is defined %}
      A2A_SOURCE="{{ item.a2a.source }}"
      {% endif %}
      {% if item.a2a is defined and item.a2a.sink is defined %}
      A2A_SINK="{{ item.a2a.sink }}"
      {% endif %}
      {% if item.a2h is defined and item.a2h.source is defined %}
      A2H_SOURCE="{{ item.a2h.source }}"
      {% endif %}
      {% if item.a2h is defined and item.a2h.sink is defined %}
      A2H_SINK="{{ item.a2h.sink }}"
      {% endif %}
  loop: "{{ local_captures }}"
  notify: 
    - Restart alsa2alsa
    - Restart alsa2http

- name: Create alsa2alsa script
  ansible.builtin.template:
    src: usr/local/bin/alsa2alsa.j2
    dest: /usr/local/bin/alsa2alsa
    owner: root
    group: root
    mode: '0755'
  notify: Restart alsa2alsa

- name: Create alsa2http script
  ansible.builtin.template:
    src: usr/local/bin/alsa2http.j2
    dest: /usr/local/bin/alsa2http
    owner: root
    group: root
    mode: '0755'
  notify: Restart alsa2http

- name: Create generic alsa2alsa service file
  ansible.builtin.template:
    src: etc/systemd/system/alsa2alsa@.service.j2
    dest: /etc/systemd/system/alsa2alsa@.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart alsa2alsa

- name: Create alsa2http services
  when: local_captures | selectattr('a2h', 'defined') | list | length > 0
  block:
    - name: Load snd_aloop permanently
      community.general.modprobe:
        name: snd_aloop
        state: present
        persistent: present

    - name: Create generic alsa2http service file
      ansible.builtin.template:
        src: etc/systemd/system/alsa2http@.service.j2
        dest: /etc/systemd/system/alsa2http@.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart alsa2http
