
local_captures:
  - name: blue2http9999
    a2a: 
      source: bluealsa
      sink: dmix:CARD=Loopback,DEV=0,SUBDEV=0
    a2h:
      source: dsnoop:CARD=Loopback,DEV=1,SUBDEV=0
      sink: 9999
  - name: localloop
    a2a: 
      source: dsnoop:CARD=sndrpihifiberry,DEV=0
      sink: hifiberry_dmix

