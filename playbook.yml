---

- name: Configure ansible tmp dir
  hosts: all
  become: true
  pre_tasks:
    - name: Create shared ansible tmp dir
      ansible.builtin.file:
        path: /var/tmp/ansible-shared/tmp
        state: directory
        mode: '1777'
        owner: root
        group: root
      check_mode: false

- name: Configure musicassistant
  hosts: musicassistants
  become: true
  roles:
    - smb_mount
    - python314
    - musicassistant

- name: Configure plumbing
  hosts: plumbed
  become: true
  roles:
    - asound_conf
    - plumbing
