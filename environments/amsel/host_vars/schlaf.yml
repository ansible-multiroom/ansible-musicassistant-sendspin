plumbings:
  - name: loudspeaker_from_wohnen
    s2a:
      sendspin_own_port: 8930
      sendspin_ma_url: "ws://wohnen.iselin.net:8927/sendspin"
      sendspin_ma_name: "{{ ansible_facts['hostname'] }}"
      sink: "dmix:CARD=sndrpihifiberry,DEV=0"
  - name: bluealsa_to_local
    a2a:
      source: bluealsa
      sink: "dmix:CARD=sndrpihifiberry,DEV=0"

## for vwbridge, VLAN

vwbridge_vlan_if: eth0
vwbridge_vlan: 500

## for vwbridge, WIFI

vwbridge_wifi_if: wlan0
vwbridge_wifi_ssid: sqalix
vwbridge_wifi_dict:
  mode: ap
  band: bg
  channel: 3
vwbridge_wifi_sec_pmf: 1
vwbridge_wifi_sec_protos:
  - rsn
